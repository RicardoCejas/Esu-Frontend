name: Frontend CI

on:
  push:
    branches:
      - develop
      - feat/turnero-mocks
      - feat/turnero-mocks-*
  pull_request:
    branches:
      - develop
      - feat/turnero-mocks
      - feat/turnero-mocks-*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-checks:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Node tests when present
        shell: bash
        run: |
          if compgen -G 'tests/*.test.mjs' > /dev/null; then
            node --experimental-strip-types --test tests/*.test.mjs
          else
            echo 'No Node test files exist on this chain step yet.'
          fi

      - name: Build production bundle
        run: npm run build
