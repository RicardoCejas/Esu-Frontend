name: Frontend CI

on:
  push:
    branches:
      - main
      - develop
      - feat/turnero-mocks
      - feat/turnero-mocks-*
  pull_request:
    branches:
      - main
      - develop
      - feat/turnero-mocks
      - feat/turnero-mocks-*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-checks:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript TypeCheck
        run: npx tsc -b

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit and Contract Tests
        run: npm test

      - name: Production Build
        run: npm run build
