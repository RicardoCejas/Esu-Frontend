server {
    listen 80;
    server_name localhost;

    # Directorio de los archivos estáticos generados por Vite
    root /usr/share/nginx/html;
    index index.html;

    # Compresión Gzip para mayor velocidad
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Soporte para Single Page Application (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy inverso para llamadas a la API REST del backend de Spring Boot
    location /api/ {
        proxy_pass http://esu-backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy para Actuator (monitoreo de salud)
    location /actuator/ {
        proxy_pass http://esu-backend:8080/actuator/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Caché para assets estáticos (imágenes, CSS, JS)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
